name: C++ CI Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      # Сборка с включенными санитайзерами памяти и неопределенного поведения
      - name: Configure CMake with Sanitizers
        run: >
          cmake -B build
          -DCMAKE_BUILD_TYPE=Debug
          -DCMAKE_CXX_FLAGS="-Wall -Wextra -Werror -fsanitize=address,undefined"

      - name: Build
        run: cmake --build build

      # 1. Запуск юнит-тестов (если сработает санитайзер, тест упадет)
      - name: Run Unit Tests
        working-directory: build
        run: ctest --output-on-failure --verbose

      # 2. Простой интеграционный тест запуска самой программы
      - name: Test CLI Output
        run: |
          OUTPUT=$(./build/app)
          echo "$OUTPUT"
          echo "$OUTPUT" | grep -q "15 / 2 = 7.5"
